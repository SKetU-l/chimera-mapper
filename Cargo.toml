[package]
name = "chimera-mapper"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
homepage = "https://github.com/SKetU-l/chimera-mapper"
repository = "https://github.com/SKetU-l/chimera-mapper"
description = "Configuration tool and side-button mapper for the Kreo Chimera V1 mouse"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
hidapi = { version = "2.6.5", features = ["macos-shared-device"] }
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
rusb = { version = "0.9", features = ["vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
foreign-types = "0.5.0"
